<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>思考遊樂場｜查查創意</title>
<meta name="description" content="用玩的，想清楚一點。每日元氣卡、夢遊扭蛋島，查查創意的思考小遊戲。">
<meta property="og:title" content="思考遊樂場｜查查創意">
<meta property="og:description" content="用玩的，想清楚一點。">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y0VX6H9PVX"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-Y0VX6H9PVX');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Montserrat:wght@700;800&display=swap">
<style>
/* Layout: one column — title, then one big tile per game, then a quiet footer. */
:root{
  color-scheme:light;
  --paper:#FFF9EC; --ink:#16244A; --ink-soft:#4A5677; --line:#E8DFC9; --chip:#FFFFFF;
  --sun:#FFD84D; --pink:#FF5FA8; --night:#1E1830;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"Montserrat","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-weight:900;font-size:clamp(32px,9vw,44px);line-height:1.15;text-wrap:balance}
h1 span{background:linear-gradient(transparent 62%,var(--sun) 62%)}
.lede{margin:4px 0 0;color:var(--ink-soft);font-size:16px}
.game{display:flex;flex-direction:column;text-decoration:none;color:inherit;border:3px solid var(--ink);border-radius:24px;overflow:hidden;
  box-shadow:6px 6px 0 var(--ink);background:var(--chip);transition:transform .15s,box-shadow .15s}
a.game:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
a.game:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
.art{height:190px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-bottom:3px solid var(--ink)}
.art img{display:block;max-width:100%}
.genki .art{background:#FF5FA8 radial-gradient(circle,#FFD84D 3px,transparent 3.4px) 0 0/24px 24px;align-items:center}
.genki .art img{height:170px;width:170px;object-fit:cover;border-radius:18px;border:3px solid var(--ink)}
.island .art{background:var(--night)}
.island .art img{height:180px;width:auto;object-fit:cover}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:800 12px/1 var(--body);letter-spacing:.06em;padding:6px 10px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line)}
.info h2{margin:2px 0 0;font-size:24px;font-weight:900}
.info p{margin:0;color:var(--ink-soft);font-size:15px}
.go{margin-top:8px;align-self:flex-start;font:900 16px/1 var(--body);background:var(--pink);color:#fff;padding:13px 20px;border-radius:14px;box-shadow:0 5px 0 #C93D80}
.soon .go{background:var(--line);color:var(--ink-soft);box-shadow:none}
.soon{opacity:.92}
footer{text-align:center;font-size:13px;color:var(--ink-soft)}
footer a{color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){a.game{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>思考<span>遊樂場</span></h1>
    <p class="lede">用玩的，想清楚一點。挑一個今天想玩的遊戲。</p>
  </header>

  <a class="game genki" href="genki/" data-game="genki">
    <div class="art"><img src="img/genki.jpg" alt="每日元氣卡插畫"></div>
    <div class="info">
      <div class="meta"><span class="pill">每天 1 分鐘</span><span class="pill">每天 3 次</span><span class="pill">免註冊</span></div>
      <h2>每日元氣卡</h2>
      <p>今天卡在哪裡？選一類，抽一張卡：一個題目、一個小解法、一句名言。抽到喜歡的收進卡冊，也能送給朋友。</p>
      <span class="go">去抽卡 →</span>
    </div>
  </a>

  <div class="game island soon" data-game="island" aria-disabled="true">
    <div class="art"><img src="img/island.jpg" alt="夢遊扭蛋島的守護獸"></div>
    <div class="info">
      <div class="meta"><span class="pill">約 3 分鐘</span><span class="pill">10 個問題</span><span class="pill">即將開放</span></div>
      <h2>夢遊扭蛋島</h2>
      <p>下班後還在想「這樣下去好嗎」？回答 10 個問題，扭蛋機會轉出一隻跟你很像的守護獸，說出你心裡知道、卻一直沒說出口的事。</p>
      <span class="go">即將開放</span>
    </div>
  </div>

  <footer>查查創意｜Cha Cha　·　<a href="https://www.designthinking.com.tw/" target="_blank" rel="noopener">回官網</a></footer>
</div>
<script>
document.querySelectorAll("a.game").forEach(a=>a.addEventListener("click",()=>{try{gtag("event","playground_click",{game:a.dataset.game})}catch(e){}}));
</script>
</body>
</html>
